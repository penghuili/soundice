<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Soundice — 重新发现你的 Spotify 曲库</title>
    <meta name="description" content="从你的 Spotify 曲库中随机抽取一张专辑、一位艺人、一首歌或一集播客。" />
    <meta name="keywords" content="Soundice, Spotify, 随机专辑, 音乐发现, 播客" />
    <meta name="application-name" content="Soundice" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soundice" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=4" />
    <link rel="icon" href="/soundice-mark.svg?v=3" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=4" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10160c" />
    <script>
      (() => {
        const reloadKey = 'soundice:asset-reload';
        const reloadWindowMs = 30_000;

        function refreshAfterAssetFailure() {
          const url = new URL(window.location.href);
          if (url.searchParams.has('_asset_refresh')) return;

          try {
            const previousReload = Number(sessionStorage.getItem(reloadKey));
            if (previousReload && Date.now() - previousReload < reloadWindowMs) return;
            sessionStorage.setItem(reloadKey, String(Date.now()));
          } catch {
            // Continue with the reload if sessionStorage is unavailable.
          }

          url.searchParams.set('_asset_refresh', String(Date.now()));
          window.location.replace(url.href);
        }

        window.addEventListener('error', event => {
          const script = event.target;
          if (!(script instanceof HTMLScriptElement) || !script.src) return;

          const scriptUrl = new URL(script.src, window.location.href);
          if (scriptUrl.origin === window.location.origin && scriptUrl.pathname.endsWith('.js')) {
            refreshAfterAssetFailure();
          }
        }, true);

        window.addEventListener('unhandledrejection', event => {
          const message = event.reason?.message || String(event.reason || '');
          if (/failed to fetch|dynamically imported module|importing a module script failed/i.test(message)) {
            refreshAfterAssetFailure();
          }
        });
      })();
    </script>
  </head>
  <body>
    <noscript>Soundice 需要 JavaScript 才能连接 Spotify。</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
